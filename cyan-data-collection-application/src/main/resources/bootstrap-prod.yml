spring:
  config:
    import:
      - "nacos:arch-base.yaml?group=DEFAULT_GROUP&tenant=prod"
  application:
    name: cyan-employee
  cloud:
    nacos:
      # 通用配置（配置中心和注册中心可共享）
      server-addr: 10.0.0.2:8848
      username: nacos
      password: nacos
      # 配置中心专项配置
      config:
        file-extension: yaml
        namespace: prod
      # 注册中心专项配置
      discovery:
        ephemeral: true
        namespace: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://10.0.0.2:3306/cyan_data_collection?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
  kafka:
    bootstrap-servers: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000
        reconnect.backoff.ms: 500
        reconnect.backoff.max.ms: 3000

tracking:
  kafka:
    bootstrap-servers: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
